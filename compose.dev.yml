services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app:Z
      - frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      VITE_CONTACT_API_URL: http://127.0.0.1:3000/api/contact
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      VITE_GOOGLE_TAG_MANAGER_ID: ${VITE_GOOGLE_TAG_MANAGER_ID}
    init: true

  backend:
    image: oven/bun:1.4
    working_dir: /app/backend
    command: ["/bin/sh", "-c", "bun install --frozen-lockfile && bun run dev"]
    ports:
      - "3000:3000"
    volumes:
      - .:/app:Z
      - backend_node_modules:/app/backend/node_modules
    env_file:
      - path: ./.env
        required: false
    init: true

volumes:
  frontend_node_modules:
  backend_node_modules:
